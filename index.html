<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Debate Timer — IES Cánovas del Castillo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --navy: #0e385c;
      --teal: #219d8d;
      --gold: #ecc264;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --green-btn: #16a34a;
      --green-btn-hover: #15803d;
      --red-btn: #dc2626;
      --red-btn-hover: #b91c1c;
      --amber-btn: #d97706;
      --amber-btn-hover: #b45309;
      --overtime-red: #dc2626;
      --overtime-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* 8-Tab Top Navigation Bar */
    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      background-color: #cbd5e1;
      border-bottom: 2px solid #94a3b8;
      gap: 2px;
      padding: 4px 4px 0 4px;
    }

    .tab-btn {
      background-color: #e2e8f0;
      border: 1px solid #94a3b8;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 12px 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-align: center;
      line-height: 1.25;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 62px;
    }

    .tab-btn:hover {
      background-color: #f8fafc;
      color: var(--navy);
    }

    .tab-btn.active {
      background-color: var(--bg-page);
      color: var(--navy);
      font-weight: 800;
      border-top: 4px solid var(--teal);
      margin-bottom: -2px;
      padding-bottom: 14px;
      z-index: 2;
    }

    .tab-btn.has-overtime {
      color: var(--overtime-red);
    }

    .tab-btn.active.has-overtime {
      border-top-color: var(--overtime-red);
    }

    .tab-badge {
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 3px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(14, 56, 92, 0.08);
      color: var(--navy);
      font-family: 'JetBrains Mono', monospace;
    }

    .tab-btn.has-overtime .tab-badge {
      background: #fee2e2;
      color: var(--overtime-red);
    }

    /* Main Workspace */
    .main-container {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Header: Logo Left, Title Center, Language Right */
    .header-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .logo-container img {
      max-height: 76px;
      width: auto;
      object-fit: contain;
    }

    .main-title {
      font-size: clamp(1.75rem, 3.2vw, 2.75rem);
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      text-align: center;
    }

    .lang-wrapper {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .lang-select {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--navy);
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    .lang-select:focus,
    .lang-select:hover {
      border-color: var(--teal);
    }

    /* Center Stage Card */
    .timer-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 24px 36px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .timer-card.overtime-mode {
      background-color: var(--overtime-bg);
      border-color: #fca5a5;
    }

    .stage-heading {
      font-size: clamp(1.5rem, 2.8vw, 2.35rem);
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 8px;
    }

    .overtime-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 14px;
      border-radius: 999px;
      background-color: #fee2e2;
      color: var(--overtime-red);
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.2s ease;
    }

    .timer-card.overtime-mode .overtime-pill {
      opacity: 1;
      transform: translateY(0);
    }

    .clock-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: clamp(5.5rem, 15vw, 11.5rem);
      line-height: 1;
      color: var(--navy);
      letter-spacing: -0.03em;
      margin: 8px 0 20px;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }

    .timer-card.overtime-mode .clock-wrapper {
      color: var(--overtime-red);
    }

    .overtime-plus {
      display: none;
      margin-right: 4px;
    }

    .timer-card.overtime-mode .overtime-plus {
      display: inline;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      max-width: 680px;
      height: 10px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background-color: var(--teal);
      border-radius: 999px;
      transition: width 0.25s linear, background-color 0.25s ease;
    }

    .timer-card.overtime-mode .progress-fill {
      width: 100% !important;
      background-color: var(--overtime-red);
    }

    /* Main Action Buttons (Large Touch Targets) */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 26px;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 16px 38px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: #ffffff;
      min-width: 165px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-start {
      background-color: var(--green-btn);
    }
    .btn-start:hover {
      background-color: var(--green-btn-hover);
    }

    .btn-pause {
      background-color: var(--amber-btn);
    }
    .btn-pause:hover {
      background-color: var(--amber-btn-hover);
    }

    .btn-reset {
      background-color: var(--red-btn);
    }
    .btn-reset:hover {
      background-color: var(--red-btn-hover);
    }

    /* Programmable Duration Controls */
    .setup-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      width: 100%;
      max-width: 680px;
    }

    .setup-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .time-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .time-field input {
      width: 58px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--navy);
      border: none;
      background: transparent;
      text-align: center;
      outline: none;
    }

    .time-field span {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-apply {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 10px;
      border: 2px solid var(--navy);
      background-color: var(--navy);
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-apply:hover {
      background-color: #164e7f;
    }

    @media (max-width: 960px) {
      .tabs-bar {
        grid-template-columns: repeat(4, 1fr);
      }
      .header-row {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .logo-container,
      .lang-wrapper {
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .tabs-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 8 Debate Tabs -->
  <nav class="tabs-bar" id="tabs-bar" role="tablist"></nav>

  <main class="main-container">
    <!-- Top Branding & Language Header -->
    <header class="header-row">
      <div class="logo-container">
        <img src="LOGO-HORIZONTAL.png" alt="IES Cánovas del Castillo - Málaga" />
      </div>

      <h1 class="main-title" id="ui-main-title">Academic Debate</h1>

      <div class="lang-wrapper">
        <select id="lang-select" class="lang-select" aria-label="Language">
          <option value="en">🇬🇧 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
      </div>
    </header>

    <!-- Active Stage Timer Card -->
    <section class="timer-card" id="timer-card">
      <div class="overtime-pill" id="ui-overtime-badge">OVERTIME</div>
      <h2 class="stage-heading" id="stage-heading">Introduction. Team In Favor.</h2>

      <div class="clock-wrapper">
        <span class="overtime-plus" id="overtime-plus">+</span><span id="timer-display">03:00</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>

      <div class="controls-row">
        <button class="btn btn-start" id="btn-start">Start</button>
        <button class="btn btn-reset" id="btn-reset">Reset</button>
      </div>

      <div class="setup-bar">
        <label class="setup-label" id="ui-initial-label" for="input-mins">Initial time:</label>
        <div class="time-inputs">
          <div class="time-field">
            <input type="number" id="input-mins" min="0" max="99" value="3" />
            <span id="ui-min-unit">min</span>
          </div>
          <div class="time-field">
            <input type="number" id="input-secs" min="0" max="59" value="0" />
            <span id="ui-sec-unit">sec</span>
          </div>
        </div>
        <button class="btn-apply" id="btn-apply">Set Time</button>
      </div>
    </section>
  </main>

  <script>
    const TRANSLATIONS = {
      en: {
        mainTitle: "Academic Debate",
        overtime: "OVERTIME",
        start: "Start",
        pause: "Pause",
        resume: "Resume",
        reset: "Reset",
        initialLabel: "Initial time:",
        minUnit: "min",
        secUnit: "sec",
        setTime: "Set Time",
        tabs: [
          { tab: "Introduction.<br>In Favor", heading: "Introduction. Team In Favor." },
          { tab: "Introduction.<br>Against", heading: "Introduction. Team Against." },
          { tab: "Rebuttal 1.<br>In Favor", heading: "Rebuttal 1. Team In Favor." },
          { tab: "Rebuttal 1.<br>Against", heading: "Rebuttal 1. Team Against." },
          { tab: "Rebuttal 2.<br>In Favor", heading: "Rebuttal 2. Team In Favor." },
          { tab: "Rebuttal 2.<br>Against", heading: "Rebuttal 2. Team Against." },
          { tab: "Conclusion.<br>Against", heading: "Conclusion. Team Against." },
          { tab: "Conclusion.<br>In Favor", heading: "Conclusion. Team In Favor." }
        ]
      },
      es: {
        mainTitle: "Debate Académico",
        overtime: "TIEMPO EXCEDIDO",
        start: "Inicio",
        pause: "Pausa",
        resume: "Reanudar",
        reset: "Reiniciar",
        initialLabel: "Tiempo inicial:",
        minUnit: "min",
        secUnit: "seg",
        setTime: "Aplicar",
        tabs: [
          { tab: "Introducción.<br>A Favor", heading: "Introducción. Equipo A Favor." },
          { tab: "Introducción.<br>En Contra", heading: "Introducción. Equipo En Contra." },
          { tab: "Refutación 1.<br>A Favor", heading: "Refutación 1. Equipo A Favor." },
          { tab: "Refutación 1.<br>En Contra", heading: "Refutación 1. Equipo En Contra." },
          { tab: "Refutación 2.<br>A Favor", heading: "Refutación 2. Equipo A Favor." },
          { tab: "Refutación 2.<br>En Contra", heading: "Refutación 2. Equipo En Contra." },
          { tab: "Conclusión.<br>En Contra", heading: "Conclusión. Equipo En Contra." },
          { tab: "Conclusión.<br>A Favor", heading: "Conclusión. Equipo A Favor." }
        ]
      },
      fr: {
        mainTitle: "Débat Académique",
        overtime: "TEMPS DÉPASSÉ",
        start: "Démarrer",
        pause: "Pause",
        resume: "Reprendre",
        reset: "Réinitialiser",
        initialLabel: "Temps initial :",
        minUnit: "min",
        secUnit: "sec",
        setTime: "Appliquer",
        tabs: [
          { tab: "Introduction.<br>Pour", heading: "Introduction. Équipe Pour." },
          { tab: "Introduction.<br>Contre", heading: "Introduction. Équipe Contre." },
          { tab: "Réfutation 1.<br>Pour", heading: "Réfutation 1. Équipe Pour." },
          { tab: "Réfutation 1.<br>Contre", heading: "Réfutation 1. Équipe Contre." },
          { tab: "Réfutation 2.<br>Pour", heading: "Réfutation 2. Équipe Pour." },
          { tab: "Réfutation 2.<br>Contre", heading: "Réfutation 2. Équipe Contre." },
          { tab: "Conclusion.<br>Contre", heading: "Conclusion. Équipe Contre." },
          { tab: "Conclusion.<br>Pour", heading: "Conclusion. Équipe Pour." }
        ]
      },
      de: {
        mainTitle: "Akademische Debatte",
        overtime: "ZEITÜBERSCHREITUNG",
        start: "Start",
        pause: "Pause",
        resume: "Fortsetzen",
        reset: "Zurücksetzen",
        initialLabel: "Startzeit:",
        minUnit: "Min",
        secUnit: "Sek",
        setTime: "Übernehmen",
        tabs: [
          { tab: "Einleitung.<br>Dafür", heading: "Einleitung. Team Dafür." },
          { tab: "Einleitung.<br>Dagegen", heading: "Einleitung. Team Dagegen." },
          { tab: "Widerlegung 1.<br>Dafür", heading: "Widerlegung 1. Team Dafür." },
          { tab: "Widerlegung 1.<br>Dagegen", heading: "Widerlegung 1. Team Dagegen." },
          { tab: "Widerlegung 2.<br>Dafür", heading: "Widerlegung 2. Team Dafür." },
          { tab: "Widerlegung 2.<br>Dagegen", heading: "Widerlegung 2. Team Dagegen." },
          { tab: "Schlusswort.<br>Dagegen", heading: "Schlusswort. Team Dagegen." },
          { tab: "Schlusswort.<br>Dafür", heading: "Schlusswort. Team Dafür." }
        ]
      }
    };

    // Default durations: 3 min (180s) for Introductions & Conclusions, 4 min (240s) for Rebuttals
    const DEFAULT_DURATIONS = [
      180, // 0: Introduction In Favor (3 min)
      180, // 1: Introduction Against (3 min)
      240, // 2: Rebuttal 1 In Favor (4 min)
      240, // 3: Rebuttal 1 Against (4 min)
      240, // 4: Rebuttal 2 In Favor (4 min)
      240, // 5: Rebuttal 2 Against (4 min)
      180, // 6: Conclusion Against (3 min)
      180  // 7: Conclusion In Favor (3 min)
    ];

    let currentLang = 'en';
    let activeTab = 0;

    // Independent timer state per tab
    const timers = DEFAULT_DURATIONS.map((secs) => ({
      initialSeconds: secs,
      remainingSeconds: secs, // Negative values represent overtime count-up
      running: false,
      intervalId: null
    }));

    // DOM Elements
    const tabsBar = document.getElementById('tabs-bar');
    const langSelect = document.getElementById('lang-select');
    const uiMainTitle = document.getElementById('ui-main-title');
    const uiOvertimeBadge = document.getElementById('ui-overtime-badge');
    const stageHeading = document.getElementById('stage-heading');
    const timerCard = document.getElementById('timer-card');
    const timerDisplay = document.getElementById('timer-display');
    const progressBar = document.getElementById('progress-bar');
    const btnStart = document.getElementById('btn-start');
    const btnReset = document.getElementById('btn-reset');
    const uiInitialLabel = document.getElementById('ui-initial-label');
    const uiMinUnit = document.getElementById('ui-min-unit');
    const uiSecUnit = document.getElementById('ui-sec-unit');
    const inputMins = document.getElementById('input-mins');
    const inputSecs = document.getElementById('input-secs');
    const btnApply = document.getElementById('btn-apply');

    // Simple subtle chime when reaching 00:00
    function playZeroBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.85);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.85);
      } catch (e) {
        // Ignore if audio context is blocked before interaction
      }
    }

    function formatTime(totalSeconds) {
      const abs = Math.abs(totalSeconds);
      const mins = Math.floor(abs / 60);
      const secs = abs % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function renderTabs() {
      const t = TRANSLATIONS[currentLang];
      tabsBar.innerHTML = '';

      t.tabs.forEach((item, index) => {
        const state = timers[index];
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        if (index === activeTab) btn.classList.add('active');
        if (state.remainingSeconds < 0) btn.classList.add('has-overtime');

        const prefix = state.remainingSeconds < 0 ? '+' : '';
        btn.innerHTML = `
          <span>${item.tab}</span>
          <span class="tab-badge">${prefix}${formatTime(state.remainingSeconds)}</span>
        `;

        btn.addEventListener('click', () => switchTab(index));
        tabsBar.appendChild(btn);
      });
    }

    function updateDisplay() {
      const t = TRANSLATIONS[currentLang];
      const state = timers[activeTab];
      const isOvertime = state.remainingSeconds < 0;

      uiMainTitle.textContent = t.mainTitle;
      uiOvertimeBadge.textContent = t.overtime;
      stageHeading.textContent = t.tabs[activeTab].heading;
      uiInitialLabel.textContent = t.initialLabel;
      uiMinUnit.textContent = t.minUnit;
      uiSecUnit.textContent = t.secUnit;
      btnApply.textContent = t.setTime;
      btnReset.textContent = t.reset;

      // Update Start/Pause/Resume button
      if (state.running) {
        btnStart.textContent = t.pause;
        btnStart.className = 'btn btn-pause';
      } else {
        const isPristine = state.remainingSeconds === state.initialSeconds;
        btnStart.textContent = isPristine ? t.start : t.resume;
        btnStart.className = 'btn btn-start';
      }

      // Overtime red styling
      if (isOvertime) {
        timerCard.classList.add('overtime-mode');
      } else {
        timerCard.classList.remove('overtime-mode');
      }

      // Digital clock readout
      timerDisplay.textContent = formatTime(state.remainingSeconds);

      // Progress bar percentage
      if (isOvertime || state.initialSeconds === 0) {
        progressBar.style.width = '100%';
      } else {
        const pct = Math.max(0, (state.remainingSeconds / state.initialSeconds) * 100);
        progressBar.style.width = `${pct}%`;
      }

      renderTabs();
    }

    function switchTab(index) {
      activeTab = index;
      const state = timers[activeTab];
      inputMins.value = Math.floor(state.initialSeconds / 60);
      inputSecs.value = state.initialSeconds % 60;
      updateDisplay();
    }

    function toggleTimer() {
      const state = timers[activeTab];

      if (state.running) {
        clearInterval(state.intervalId);
        state.running = false;
        updateDisplay();
        return;
      }

      state.running = true;
      updateDisplay();

      state.intervalId = setInterval(() => {
        state.remainingSeconds -= 1;
        if (state.remainingSeconds === 0) {
          playZeroBell();
        }
        updateDisplay();
      }, 1000);
    }

    function resetTimer() {
      const state = timers[activeTab];
      if (state.running) {
        clearInterval(state.intervalId);
        state.running = false;
      }
      state.remainingSeconds = state.initialSeconds;
      updateDisplay();
    }

    function applyCustomTime() {
      const mins = Math.max(0, Math.min(99, parseInt(inputMins.value, 10) || 0));
      const secs = Math.max(0, Math.min(59, parseInt(inputSecs.value, 10) || 0));
      inputMins.value = mins;
      inputSecs.value = secs;

      const total = mins * 60 + secs;
      const state = timers[activeTab];
      if (state.running) {
        clearInterval(state.intervalId);
        state.running = false;
      }
      state.initialSeconds = total;
      state.remainingSeconds = total;
      updateDisplay();
    }

    // Event Listeners
    btnStart.addEventListener('click', toggleTimer);
    btnReset.addEventListener('click', resetTimer);
    btnApply.addEventListener('click', applyCustomTime);

    langSelect.addEventListener('change', (e) => {
      currentLang = e.target.value;
      updateDisplay();
    });

    // Allow pressing Enter inside the time inputs
    [inputMins, inputSecs].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') applyCustomTime();
      });
    });

    // Initialize UI
    switchTab(0);
  </script>
</body>
</html>
